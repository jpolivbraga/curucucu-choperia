<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conheça Piri | Curucucu</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --verde-escuro: #2B3B2B;
      --verde: #3D533D;
      --amarelo: #ECA320;
      --fundo: #FFECD3;
      --branco: #FFF8EF;
      --bege: #F4DFC1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--fundo);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(255,248,239,0.5) 0, transparent 35%),
        radial-gradient(circle at 85% 0%, rgba(139,50,54,0.08) 0, transparent 40%),
        radial-gradient(circle at 50% 100%, rgba(61,83,61,0.12) 0, transparent 45%);
      font-family: "Work Sans", sans-serif;
      color: var(--verde-escuro);
      display: flex;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }
    .wrap { max-width: 420px; width: 100%; }
    a.back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--verde-escuro);
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0.7;
    }
    h1 {
      font-family: "Fraunces", serif;
      font-size: 1.9rem;
      font-weight: 700;
      margin: 1.5rem 0 0.5rem;
    }
    p.lead {
      font-size: 0.9rem;
      line-height: 1.6;
      opacity: 0.85;
      margin-bottom: 2rem;
    }
    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: rgba(255,248,239,0.55);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: 0 8px 24px -10px rgba(43,59,43,0.35);
      border-radius: 1rem;
      padding: 1.1rem 1.3rem;
      text-decoration: none;
      color: inherit;
      margin-bottom: 0.9rem;
      transition: transform 0.2s ease;
    }
    .card:hover { transform: translateY(-2px); }
    .card-title {
      font-family: "Fraunces", serif;
      font-size: 1.05rem;
      font-weight: 600;
      display: block;
    }
    .card-sub {
      font-size: 0.78rem;
      opacity: 0.7;
      display: block;
      margin-top: 2px;
    }
    .arrow { opacity: 0.4; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← Voltar para a Curucucu</a>
    <h1>Conheça Piri</h1>
    <p class="lead">Descubra os cantos mais bonitos de Pirenópolis. Escolha um guia abaixo:</p>

    <a class="card" href="/docs/atrativos-naturais.pdf" target="_blank" rel="noopener noreferrer">
      <span>
        <span class="card-title">Atrativos Naturais</span>
        <span class="card-sub">Cachoeiras, trilhas e paisagens</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="card" href="/docs/mirantes.pdf" target="_blank" rel="noopener noreferrer">
      <span>
        <span class="card-title">Mirantes</span>
        <span class="card-sub">Os melhores pontos de vista da cidade</span>
      </span>
      <span class="arrow">›</span>
    </a>
  </div>
</body>
</html>
